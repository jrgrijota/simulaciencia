name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      indexnow_todas:
        description: 'Avisar por IndexNow de todas las páginas (no solo las nuevas)'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

# Un solo despliegue concurrente; no cancela el que esté en curso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      indexnow: ${{ steps.indexnow.outputs.urls }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Pandoc genera las guías docentes en Word y LibreOffice. Versión fija: el
      # script retoca su XML y comprueba que tiene la forma esperada.
      - name: Instalar Pandoc
        run: |
          curl -sSL -o pandoc.deb https://github.com/jgm/pandoc/releases/download/3.12.1/pandoc-3.12.1-1-amd64.deb
          sudo dpkg -i pandoc.deb
      - run: npm run build
      # Antes de desplegar, para comparar con el sitemap aún publicado.
      - name: Páginas para IndexNow
        id: indexnow
        continue-on-error: true
        run: |
          node scripts/indexnow.mjs list ${{ inputs.indexnow_todas && '--todas' || '' }} > indexnow.txt
          { echo 'urls<<EOF'; cat indexnow.txt; echo 'EOF'; } >> "$GITHUB_OUTPUT"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Avisa a Bing, Yandex, Seznam, Naver… de las páginas nuevas. Si falla, la web
  # ya está publicada igualmente: los buscadores la encontrarán por el sitemap.
  indexnow:
    needs: [build, deploy]
    if: needs.build.outputs.indexnow != ''
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: printf '%s\n' "$URLS" > indexnow.txt && node scripts/indexnow.mjs send indexnow.txt
        env:
          URLS: ${{ needs.build.outputs.indexnow }}
