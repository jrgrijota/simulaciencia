name: Comprobar PR

# En cada PR hacia main: la web compila, las páginas se pregeneran y no hay enlaces
# internos rotos. Si falla, el PR lo muestra antes de fusionar.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Instalar Pandoc
        run: |
          curl -sSL -o pandoc.deb https://github.com/jgm/pandoc/releases/download/3.12.1/pandoc-3.12.1-1-amd64.deb
          sudo dpkg -i pandoc.deb
      - run: npm run build
      - name: Enlaces internos
        run: node scripts/check-links.mjs
